<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a1f3e">
    <title>Metro Rush - Corrida Infinita</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="500" style="width:100%; max-width:800px; height:auto; aspect-ratio:800/500"></canvas>
        <div class="game-ui">
            <div class="score-panel"><span>🏆 SCORE</span> <span id="scoreValue">0</span></div>
            <button class="restart-btn" id="restartButton">🚀 CORRER</button>
        </div>
        <div class="controls-info">
            <span>⬅️ ESQUERDA</span>
            <span>➡️ DIREITA</span>
            <span>⬆️ PULAR</span>
        </div>
        <div id="gameStatus" class="status-msg">💨 Deslize ou use setas | Pegue moedas e evite trens!</div>
    </div>
</div>

<script src="./assets/js/game.js"></script>
<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
</script>
</body>
</html>
