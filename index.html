<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a1f3e">
    <title>Metro Rush - Corrida Infinita</title>
    <link rel="manifest" href="/metro-rush-corrida-infinita/manifest.json">
    <link rel="stylesheet" href="/metro-rush-corrida-infinita/assets/css/style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div>
    <div class="game-container">
        <div class="hud-top">
            <div class="score-panel">
                <i data-lucide="trophy"></i>
                <span>SCORE</span> 
                <span id="scoreValue">0</span>
            </div>
            <div class="speed-panel">
                <i data-lucide="zap"></i>
                <span id="speedValue">5.2</span>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div class="game-ui">
            <button class="restart-btn" id="restartButton">
                <i data-lucide="rocket"></i> CORRER
            </button>
        </div>
        
        <div class="controls-info">
            <span><i data-lucide="arrow-left"></i> ESQUERDA</span>
            <span><i data-lucide="arrow-right"></i> DIREITA</span>
            <span><i data-lucide="arrow-up"></i> PULAR</span>
        </div>
        
        <div id="gameStatus" class="status-msg">
            <i data-lucide="hand"></i> Deslize ou use setas | Pegue moedas e evite trens!
        </div>
    </div>
</div>
<script src="/metro-rush-corrida-infinita/assets/js/game.js"></script>
<script>
    lucide.createIcons();
</script>
</body>
</html>
